  <script>
    const projects = {
      'ux-research': {
        title: 'UX Research : Portfolio Summary',
        summary: 'Comprehensive user research across mobile superapp and corporate web platforms to uncover behavior, validate flows, and optimize conversion.',
        tags: ['UX Research', 'Usability Testing', 'Mobile Superapp', 'Think Aloud Protocol'],
        img: '/assets/84c5abff-bb98-4248-be97-78d7775b0063.webp',
        gradient: 'linear-gradient(135deg,#2D1B4E 0%,#6B3FA0 50%,#9B6BD4 100%)',
        role: 'UX Researcher, Digital Experience Team',
        domain: 'Mobile superapp &amp; company website',
        stack: 'Figma, Mobbin, NNGroup, Claude, Internal Click Tracker Tool',
        mockupVideoTitle: 'UX Research Usability Testing Laboratory Simulation',
        mockupHtml: '<div style="background:#201A2E;border-radius:10px;padding:24px;width:90%;border:1px solid rgba(255,255,255,0.1);text-align:left"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><span style="color:#C49BFF;font-family:monospace;font-size:12px">● LIVE TESTING OBSERVATION</span><span style="color:#888;font-size:11px">Participant 04 : Task 2 / 5</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="background:#130E1F;padding:12px;border-radius:6px;font-size:12px;color:#eee"><strong>Flow:</strong> Add on Subscription<br><span style="color:#27C93F">Status: Completed (48s)</span></div><div style="background:#130E1F;padding:12px;border-radius:6px;font-size:12px;color:#eee"><strong>Think Aloud Note:</strong> User looked for payment total above checkout button.</div></div><div style="margin-top:14px;background:#130E1F;padding:10px;border-radius:6px;font-size:11px;color:#aaa">Heatmap click density: 92% first touch accuracy on redesigned partner tile.</div></div>',
        bodyHtml: '<h2 class="section-title">User Testing</h2><p>Planned and moderated usability testing sessions with up to 6 participants per round using think aloud protocol. Sessions were conducted in a dedicated testing facility using Figma prototypes.</p><h3 style="font-size:17px;font-weight:600;margin:16px 0 8px">Types of flows tested:</h3><ul><li>Onboarding &amp; account activation flows</li><li>A/B tests comparing UI placements and interaction patterns</li><li>Add on and subscription management flows</li><li>Payment and cashback flows</li><li>Support, FAQ, and account management flows</li></ul><h3 style="font-size:17px;font-weight:600;margin:16px 0 8px">Deliverables per round:</h3><p>Pre screening questionnaires, task scenario scripts, observation trackers, participant finding reports, and stakeholder presentation decks.</p><h2 class="section-title">Other Research Activities</h2><ul><li>Competitive benchmarking of regional telco apps and chatbot experiences</li><li>Heuristic evaluations using Nielsen 10 heuristics</li><li>Secondary research drawing on industry publications</li><li>Built an internal browser based usability testing tool with click tracking and heatmaps</li></ul><h2 class="section-title">Tools &amp; Resources</h2><table class="data-table"><thead><tr><th>Tool</th><th>Purpose</th></tr></thead><tbody><tr><td><strong>Mobbin</strong></td><td>UI pattern reference &amp; flow benchmarking</td></tr><tr><td><strong>NNGroup</strong></td><td>Research frameworks, heuristics, A/B testing methodology</td></tr><tr><td><strong>Claude</strong></td><td>Research assistant for drafting, synthesis, and competitive analysis</td></tr><tr><td><strong>Industry Articles</strong></td><td>Backing for design and research decisions</td></tr></tbody></table>'
      },
      'ar-furniture': {
        title: 'AR Furniture',
        summary: 'An augmented reality shopping app built with Unity and Blender that lets customers preview true to scale 3D furniture in their own space before buying.',
        tags: ['AR', 'UX Design', 'Mobile', '3D Prototyping'],
        img: '/assets/5c173291-74c0-40c5-9743-7cb6c1419bbb.webp',
        gradient: 'linear-gradient(135deg,#F5E0C8 0%,#D4A06A 55%,#B8803A 100%)',
        role: 'Lead 3D &amp; AR Interaction Designer',
        domain: 'Spatial Commerce / E Commerce',
        stack: 'Unity 3D, Blender, ARFoundation, Figma',
        mockupVideoTitle: 'AR Spatial Placement 60 FPS Simulation',
        mockupHtml: '<div style="background:#2C2216;border-radius:10px;padding:24px;width:90%;border:1px solid rgba(255,255,255,0.1);text-align:center"><div style="font-family:monospace;font-size:12px;color:#FFE040;margin-bottom:8px">● AR SURFACE DETECTED (LIDAR / CAMERA)</div><div style="font-size:14px;color:#fff;margin-bottom:12px">True to scale Nordic Lounge Chair placed on floor plane</div><div style="display:inline-flex;gap:12px;background:rgba(0,0,0,0.4);padding:8px 16px;border-radius:100px;font-size:12px;color:#ccc"><span>Scale: 100%</span><span>Dimensions: 82cm x 78cm x 75cm</span><span>Material: Walnut + Fabric</span></div></div>',
        bodyHtml: '<h2 class="section-title">Overview &amp; Problem Statement</h2><p>Online furniture shopping often suffers from high return rates and hesitation because consumers cannot accurately judge dimensions, materials, or spatial fit within their existing rooms. AR Furniture solves this by delivering realistic real time spatial placement directly on consumer smartphones.</p><h2 class="section-title">Design &amp; Prototyping Process</h2><p>Iterative 3D modeling and lighting optimization in Blender ensured accurate real world scale and texture rendering on mobile hardware. Custom gesture controls were designed to enable intuitive rotation, elevation locking, and tap to place interactions with minimal latency.</p><h2 class="section-title">Key Outcomes &amp; Impact</h2><p>Delivered an intuitive interactive shopping experience that bridges the physical digital gap, allowing customers to preview products in photorealistic scale before checkout.</p>'
      },
      'ar-blood': {
        title: 'AR Blood (BloodAR)',
        summary: 'An educational AR app built with Unity and Blender that converts static textbook diagrams into interactive 3D visualizations of blood cell functions.',
        tags: ['AR', 'Healthcare', 'Research', 'EdTech'],
        img: '/assets/11d48a4a-c90a-4476-8e45-505471ed5ba7.webp',
        gradient: 'linear-gradient(135deg,#2A0808 0%,#681515 50%,#C02828 100%)',
        role: 'Product Designer &amp; Educational Researcher',
        domain: 'Medical Education / Interactive Science',
        stack: 'Unity 3D, Blender, Mobile AR, Educational UX',
        mockupVideoTitle: 'BloodAR Interactive Cellular Anatomy Simulation',
        mockupHtml: '<div style="background:#260606;border-radius:10px;padding:24px;width:90%;border:1px solid rgba(255,255,255,0.1);text-align:center"><div style="font-family:monospace;font-size:12px;color:#FF6B6B;margin-bottom:8px">● CELLULAR MICROSCOPY 3D VIEW</div><div style="font-size:14px;color:#fff;margin-bottom:12px">Active Erythrocyte &amp; Leukocyte Interaction</div><div style="display:inline-flex;gap:12px;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:100px;font-size:12px;color:#ccc"><span>Magnification: 4000x</span><span>Oxygen Transport Flow: Active</span></div></div>',
        bodyHtml: '<h2 class="section-title">Overview &amp; Problem Statement</h2><p>Medical and biology students routinely struggle with complex microscopic cardiovascular systems depicted only as flat 2D textbook drawings. BloodAR unlocks cellular physiology by projecting active, animated 3D blood flow and cell interactions into physical study environments.</p><h2 class="section-title">Design &amp; Prototyping Process</h2><p>Collaborated with educational stakeholders to map curriculum requirements. Designed tactile touch controls and zoom cameras allowing learners to inspect erythrocytes, leukocytes, and thrombocytes from multiple perspectives while viewing live scientific metadata.</p><h2 class="section-title">Key Outcomes &amp; Impact</h2><p>Significantly improved comprehension and recall speed in testing cohorts, transforming passive textbook memorization into engaging kinetic learning.</p>'
      },
      'pacemate': {
        title: 'PaceMate',
        summary: 'A community web application created for NiceRun Club, designed to connect local runners, track individual pacing milestones, and coordinate group workouts.',
        tags: ['UX Research', 'Mobile Web', 'Community', 'Fitness'],
        img: '/assets/1abc1530-a9ad-4091-a16c-d577bbb8f376.webp',
        gradient: 'linear-gradient(135deg,#0A2A3A 0%,#0D5A7A 50%,#10A0C8 100%)',
        role: 'UI/UX Designer &amp; Frontend Architect',
        domain: 'Social Fitness / Local Running Club',
        stack: 'Figma, Mobile UI/UX, Web App, Community Architecture',
        mockupVideoTitle: 'PaceMate Community Run Flow Simulation',
        mockupHtml: '<div style="background:#072230;border-radius:10px;padding:24px;width:90%;border:1px solid rgba(255,255,255,0.1);text-align:center"><div style="font-family:monospace;font-size:12px;color:#4ECDC4;margin-bottom:8px">● NICERUN CLUB WEEKLY 10KM PACER</div><div style="font-size:14px;color:#fff;margin-bottom:12px">Target Pace: 5:30 min/km · 24 Runners Registered</div><div style="display:inline-flex;gap:12px;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:100px;font-size:12px;color:#ccc"><span>Elevation: +45m</span><span>Leaderboard: Live</span></div></div>',
        bodyHtml: '<h2 class="section-title">Overview &amp; Problem Statement</h2><p>Running clubs thrive on community camaraderie, but organizing group runs across varied pace groups and skill levels is traditionally fragmented across chat groups and disorganized spreadsheets. PaceMate provides a unified home for workout schedules, leaderboards, and route sharing.</p><h2 class="section-title">Design &amp; Prototyping Process</h2><p>Conducted user interviews with club members across beginner, intermediate, and marathon tiers. Built persona journey maps and low to high fidelity wireframes in Figma focusing on rapid mobile scanning and quick workout check ins.</p><h2 class="section-title">Key Outcomes &amp; Impact</h2><p>Streamlined club communication, increased attendance for weekly group sessions, and created a warm, community first digital touchpoint for athletes of all speeds.</p>'
      }
    };

    function selectProject(id) {
      const data = projects[id] || projects['ux-research'];
      document.getElementById('project-title').textContent = data.title;
      document.getElementById('project-summary').textContent = data.summary;
      document.getElementById('project-img').src = data.img;
      document.getElementById('project-img').alt = data.title;
      document.getElementById('preview-gradient').style.background = data.gradient;
      document.getElementById('video-mockup-title').textContent = data.mockupVideoTitle;
      document.getElementById('mockup-content').innerHTML = data.mockupHtml;
      document.getElementById('project-body-content').innerHTML = data.bodyHtml;
      document.getElementById('meta-role').textContent = data.role;
      document.getElementById('meta-domain').textContent = data.domain;
      document.getElementById('meta-stack').textContent = data.stack;

      const tagsContainer = document.getElementById('project-tags');
      tagsContainer.innerHTML = '';
      data.tags.forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagsContainer.appendChild(s);
      });

      document.querySelectorAll('.switch-btn').forEach(btn => {
        const active = btn.getAttribute('onclick').includes(id);
        btn.classList.toggle('active', active);
      });

      switchMedia('picture');

      const url = new URL(window.location);
      url.searchParams.set('project', id);
      window.history.replaceState({}, '', url);
    }

    function switchMedia(type) {
      const picWrap = document.getElementById('preview-gradient');
      const vidPane = document.getElementById('video-demo-pane');
      const tabPic = document.getElementById('tab-picture');
      const tabVid = document.getElementById('tab-video');

      if (type === 'video') {
        picWrap.style.display = 'none';
        vidPane.style.display = 'flex';
        tabPic.classList.remove('active');
        tabVid.classList.add('active');
      } else {
        picWrap.style.display = 'flex';
        vidPane.style.display = 'none';
        tabPic.classList.add('active');
        tabVid.classList.remove('active');
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const initialId = urlParams.get('project') || 'ux-research';
    selectProject(initialId);
  </script>
</body>
</html>
